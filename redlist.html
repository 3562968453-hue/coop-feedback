<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>个人红榜 · 在线填写</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="./config.js"></script>
  <style>
    :root {
      --bg: #f3f1ec;
      --card: #fffcf7;
      --ink: #1f1a14;
      --muted: #6a5f54;
      --line: #e2d7c8;
      --accent: #9a3f28;
      --ok: #5f7348;
      --err: #9a3f28;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(800px 360px at 12% -10%, #f0d9cf 0%, transparent 55%),
        radial-gradient(680px 320px at 100% 0%, #ebe3d4 0%, transparent 50%),
        var(--bg);
    }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 28px 18px 56px; }
    h1 { margin: 0 0 8px; font-size: 1.55rem; }
    .sub { margin: 0 0 18px; color: var(--muted); line-height: 1.55; max-width: 48rem; }
    .topbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
      align-items: center;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 10px 28px rgba(31, 26, 20, 0.05);
    }
    .panel h2 { margin: 0 0 12px; font-size: 1.08rem; }
    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    @media (max-width: 720px) { .grid2 { grid-template-columns: 1fr; } }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
    input[type="text"], textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      font: inherit;
      color: var(--ink);
      background: #fff;
    }
    textarea { min-height: 110px; resize: vertical; }
    .block { margin-top: 12px; }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
      align-items: center;
    }
    button, a.btn {
      border: 0;
      border-radius: 10px;
      padding: 10px 16px;
      font: inherit;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-ghost { background: #efe8df; color: var(--ink); }
    .status { color: var(--muted); font-size: 0.9rem; }
    .status.ok { color: var(--ok); }
    .status.err { color: var(--err); }
    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
      align-items: end;
    }
    .toolbar .field { min-width: 180px; flex: 1; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    th, td {
      border-bottom: 1px solid var(--line);
      padding: 10px 8px;
      text-align: left;
      vertical-align: top;
    }
    th { color: var(--muted); font-weight: 600; white-space: nowrap; }
    .empty { color: var(--muted); padding: 18px 4px; }
    .scroll { overflow-x: auto; }
    .text { white-space: pre-wrap; max-width: 320px; }
    .hint {
      margin: 0 0 12px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #f7ebe4;
      border: 1px solid #ebd5ca;
      color: #6a3d30;
      font-size: 0.9rem;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>个人红榜 · 在线填写</h1>
    <p class="sub">按 Excel 模版字段在线提交红榜条目，所有人可查看汇总；可一键下载当前已填写内容。</p>

    <div class="topbar">
      <button class="btn btn-ghost" type="button" id="btnDownload">下载已填写内容</button>
      <span class="status" id="downloadStatus"></span>
    </div>

    <section class="panel">
      <h2>填写红榜</h2>
      <p class="hint">字段对齐模版：领域、部门、姓名、项目、行为说明、上榜理由。填写人实名便于追溯。</p>
      <form id="form">
        <div class="grid2">
          <div>
            <label for="submitter">填写人（实名）</label>
            <input id="submitter" name="submitter_name" type="text" required placeholder="例如：韦安瑞" maxlength="40" />
          </div>
          <div>
            <label for="person">姓名（上榜人）</label>
            <input id="person" name="person_name" type="text" required placeholder="被推荐上红榜的人" maxlength="40" />
          </div>
          <div>
            <label for="domain">领域</label>
            <input id="domain" name="domain" type="text" required placeholder="例如：影像" maxlength="40" />
          </div>
          <div>
            <label for="department">部门</label>
            <input id="department" name="department" type="text" required placeholder="例如：影像1部" maxlength="60" />
          </div>
          <div style="grid-column: 1 / -1">
            <label for="project">项目</label>
            <input id="project" name="project_name" type="text" required placeholder="例如：全项目&日常工作" maxlength="120" />
          </div>
        </div>
        <div class="block">
          <label for="behavior">行为说明</label>
          <textarea id="behavior" name="behavior" required placeholder="写清做了什么、怎么做成的、带来什么结果…" maxlength="4000"></textarea>
        </div>
        <div class="block">
          <label for="reason">上榜理由</label>
          <input id="reason" name="reason" type="text" required placeholder="例如：效率提升" maxlength="120" />
        </div>
        <div class="actions">
          <button class="btn-primary" type="submit">提交红榜</button>
          <button class="btn-ghost" type="reset">清空</button>
          <span class="status" id="formStatus"></span>
        </div>
      </form>
    </section>

    <section class="panel">
      <h2>红榜汇总</h2>
      <div class="toolbar">
        <div class="field">
          <label for="filter">按姓名/部门筛选</label>
          <input id="filter" type="text" placeholder="留空显示全部" />
        </div>
        <button class="btn-ghost" type="button" id="btnRefresh">刷新</button>
        <span class="status" id="listStatus"></span>
      </div>
      <div class="scroll">
        <table>
          <thead>
            <tr>
              <th>序号</th>
              <th>时间</th>
              <th>填写人</th>
              <th>领域</th>
              <th>部门</th>
              <th>姓名</th>
              <th>项目</th>
              <th>行为说明</th>
              <th>上榜理由</th>
            </tr>
          </thead>
          <tbody id="tbody">
            <tr><td class="empty" colspan="9">加载中…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script>
    const cfg = window.FEEDBACK_CONFIG || {};
    const client = (cfg.supabaseUrl && cfg.supabaseAnonKey)
      ? window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey)
      : null;

    const form = document.getElementById("form");
    const formStatus = document.getElementById("formStatus");
    const listStatus = document.getElementById("listStatus");
    const tbody = document.getElementById("tbody");
    const filterEl = document.getElementById("filter");
    let cache = [];

    function escapeHtml(s) {
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function fmtTime(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      const p = (n) => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    }

    function filteredRows() {
      const q = filterEl.value.trim();
      if (!q) return cache.slice();
      return cache.filter((r) =>
        [r.person_name, r.department, r.domain, r.project_name, r.reason]
          .join(" ")
          .includes(q)
      );
    }

    function renderRows() {
      const filtered = filteredRows();
      if (!filtered.length) {
        tbody.innerHTML = `<tr><td class="empty" colspan="9">暂无记录</td></tr>`;
        return;
      }
      tbody.innerHTML = filtered.map((r, i) => `
        <tr>
          <td>${i + 1}</td>
          <td>${fmtTime(r.created_at)}</td>
          <td>${escapeHtml(r.submitter_name || "")}</td>
          <td>${escapeHtml(r.domain)}</td>
          <td>${escapeHtml(r.department)}</td>
          <td>${escapeHtml(r.person_name)}</td>
          <td>${escapeHtml(r.project_name)}</td>
          <td class="text">${escapeHtml(r.behavior)}</td>
          <td>${escapeHtml(r.reason)}</td>
        </tr>
      `).join("");
    }

    function downloadFilled() {
      const downloadStatus = document.getElementById("downloadStatus");
      const rows = filteredRows();
      if (!rows.length) {
        downloadStatus.textContent = "暂无已填写内容可下载";
        downloadStatus.className = "status err";
        return;
      }
      if (typeof XLSX === "undefined") {
        downloadStatus.textContent = "导出组件未加载，请刷新重试";
        downloadStatus.className = "status err";
        return;
      }
      const sheetData = [
        ["序号", "领域", "部门", "姓名", "项目", "行为说明", "上榜理由"]
      ];
      rows.forEach((r, i) => {
        sheetData.push([
          i + 1,
          r.domain || "",
          r.department || "",
          r.person_name || "",
          r.project_name || "",
          r.behavior || "",
          r.reason || ""
        ]);
      });
      const ws = XLSX.utils.aoa_to_sheet(sheetData);
      ws["!cols"] = [
        { wch: 6 },
        { wch: 10 },
        { wch: 12 },
        { wch: 10 },
        { wch: 18 },
        { wch: 60 },
        { wch: 12 }
      ];
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "红榜");
      const stamp = new Date();
      const p = (n) => String(n).padStart(2, "0");
      const name = `个人红榜_已填写_${stamp.getFullYear()}${p(stamp.getMonth() + 1)}${p(stamp.getDate())}_${p(stamp.getHours())}${p(stamp.getMinutes())}.xlsx`;
      XLSX.writeFile(wb, name);
      downloadStatus.textContent = `已导出 ${rows.length} 条`;
      downloadStatus.className = "status ok";
    }

    async function loadList() {
      if (!client) {
        listStatus.textContent = "缺少 config.js 配置";
        listStatus.className = "status err";
        return;
      }
      listStatus.textContent = "加载中…";
      listStatus.className = "status";
      const { data, error } = await client
        .from("redlist_entries")
        .select("*")
        .order("created_at", { ascending: false });
      if (error) {
        listStatus.textContent = "加载失败：" + error.message;
        listStatus.className = "status err";
        return;
      }
      cache = data || [];
      renderRows();
      listStatus.textContent = `共 ${cache.length} 条`;
      listStatus.className = "status ok";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!client) {
        formStatus.textContent = "缺少 config.js 配置";
        formStatus.className = "status err";
        return;
      }
      const fd = new FormData(form);
      const payload = {
        submitter_name: String(fd.get("submitter_name") || "").trim(),
        person_name: String(fd.get("person_name") || "").trim(),
        domain: String(fd.get("domain") || "").trim(),
        department: String(fd.get("department") || "").trim(),
        project_name: String(fd.get("project_name") || "").trim(),
        behavior: String(fd.get("behavior") || "").trim(),
        reason: String(fd.get("reason") || "").trim()
      };
      for (const [k, label] of [
        ["submitter_name", "填写人"],
        ["person_name", "姓名"],
        ["domain", "领域"],
        ["department", "部门"],
        ["project_name", "项目"],
        ["behavior", "行为说明"],
        ["reason", "上榜理由"]
      ]) {
        if (!payload[k]) {
          formStatus.textContent = `请填写${label}`;
          formStatus.className = "status err";
          return;
        }
      }
      formStatus.textContent = "提交中…";
      formStatus.className = "status";
      const { error } = await client.from("redlist_entries").insert(payload);
      if (error) {
        formStatus.textContent = "提交失败：" + error.message;
        formStatus.className = "status err";
        return;
      }
      formStatus.textContent = "提交成功";
      formStatus.className = "status ok";
      form.reset();
      await loadList();
    });

    document.getElementById("btnRefresh").addEventListener("click", loadList);
    document.getElementById("btnDownload").addEventListener("click", downloadFilled);
    filterEl.addEventListener("input", () => renderRows());

    if (client) {
      client
        .channel("redlist_live")
        .on("postgres_changes", { event: "*", schema: "public", table: "redlist_entries" }, () => loadList())
        .subscribe();
    }

    loadList();
  </script>
</body>
</html>
